version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - ./postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=fitstack
      - POSTGRES_PASSWORD=fitstack_secret
      - POSTGRES_DB=fitstack_db
    ports:
      - "5432:5432"

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://fitstack:fitstack_secret@db:5432/fitstack_db
      - SECRET_KEY=changethisrandomstringforsecurity
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
