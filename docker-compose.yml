services:
  db:
    image: postgres:15-alpine
    # Run as the current user (1000:1000) to prevent root file creation
    user: "1000:1000"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=fitstack
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=fitstack_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitstack -d fitstack_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    # Map host port 9042 to container port 8000
    ports:
      - "9042:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SQLALCHEMY_DATABASE_URI=postgresql://fitstack:${POSTGRES_PASSWORD}@db:5432/fitstack_db
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_USER_PASS=${ADMIN_USER_PASS}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION}
      - ALLOW_PASSWORD_LOGIN=${ALLOW_PASSWORD_LOGIN}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_DISCOVERY_URL=${OIDC_DISCOVERY_URL}
